name: Refresh market index

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install validator
        working-directory: .validator
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i @deepseek-ai/dsh-plugin-market-index@0.2.1-rc.2 --no-audit --no-fund

      - name: Build index
        run: node build-index.mjs index.json

      - name: Validate index
        working-directory: .validator
        run: node validate.mjs

      - name: Publish
        # 2026-11-04 修复：原来是 `git commit --amend` + `git push --force`，
        # 在 GitHub 侧被拒：`remote: fatal error in commit_refs` / `[remote rejected] HEAD -> main (failure)`。
        # amend+force 只为保持"恒定单提交"，但它依赖服务端允许改写已发布历史，不可靠。
        # 改为普通提交；索引没变时由 `git diff --cached --quiet` 拦住，不会空提交。
        run: |
          git config user.name "market-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "index unchanged, nothing to publish"
            exit 0
          fi
          git commit -m "index $(date -u +%FT%TZ)"
          git push origin HEAD:main
